<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סל</title>
<meta name="theme-color" content="#F5EDE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="סל">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #F5EDE0; }
  body { font-family: "Assistant", "Segoe UI", Arial, sans-serif; color: #3f3630; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
           padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; background: #F5EDE0; }
  .splash { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
  .splash img { width: 120px; height: 120px; border-radius: 26px; }
  .splash p { color: #4C7476; font-size: 18px; max-width: 30ch; margin: 14px auto 0; }
  .splash a { color: #4C7476; }
</style>
</head>
<body>
<div class="splash" id="splash"><div><img src="icon-512.png" alt="סל"><p id="msg">טוען את סל…</p></div></div>
<script>
// The address of the Google side of סל. The access code is never stored here:
// it arrives in each person's own link after the "#", and is remembered on that phone.
var BASE = "https://script.google.com/macros/s/AKfycby9HowMdeJkz1D9nLAYFQJDixu9iIylBNu1sBjS_HNluOtRMBws8RRuKrkRf9cyfDuSCQ/exec";
var VIEW = { nil: "office", shlomi: "week", marco: "marco", dudi: "marco" };
var q = new URLSearchParams(location.search);
var person = VIEW[q.get("p")] ? q.get("p") : "";
var view = q.get("v") || VIEW[person];
var key = location.hash.replace("#", "");
try {
  if (key) localStorage.setItem("salsala-key", key);
  else key = localStorage.getItem("salsala-key") || "";
  if (person) localStorage.setItem("salsala-person", person);
  else { person = localStorage.getItem("salsala-person") || ""; view = view || VIEW[person]; }
} catch (e) {}
if (!key || !person) {
  document.getElementById("msg").innerHTML = 'כדי להיכנס לסל פותחים את הקישור האישי שקיבלתם בוואטסאפ. <br><a href="help.html">מה זה סל?</a>';
} else {
  var f = document.createElement("iframe");
  f.title = "סל";
  f.src = BASE + "?v=" + encodeURIComponent(view) + "&u=" + encodeURIComponent(person) + "&k=" + encodeURIComponent(key);
  f.onload = function () { document.getElementById("splash").hidden = true; };
  document.body.appendChild(f);
}
</script>
</body>
</html>
